name: Bug report
description: Something doesn't work or a number looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The full error message, if any. Remove anything private.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `claude-usage-chart --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
